<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Sneaky Fart Escape</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fart Escape">
<meta name="theme-color" content="#1a0f1f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root { color-scheme: dark; font-family: "Trebuchet MS", system-ui, sans-serif; }
  html, body { margin: 0; height: 100%; background: #1a0f1f; color: #fff0cb; -webkit-text-size-adjust: 100%; }
  body { display: flex; align-items: center; justify-content: center; box-sizing: border-box;
    padding: max(16px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    background: radial-gradient(ellipse at 70% 30%, #3a2350, #1a0f1f 70%); }
  main { width: min(440px, 100%); text-align: center; }
  img { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 6px 18px #0008; }
  h1 { margin: 10px 0 6px; font: 1000 clamp(30px, 8vmin, 46px)/.95 "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif; letter-spacing: -.03em; }
  h1 span { display: block; }
  h1 span:first-child { color: #c6f775; }
  h1 span:last-child { color: #ffcb6e; }
  p { margin: 8px 0; color: #e2d6d7; font-size: 15px; line-height: 1.35; }
  form { display: flex; gap: 8px; margin: 14px 0 6px; }
  input { flex: 1; min-width: 0; box-sizing: border-box; height: 48px; padding: 0 14px; border: 1px solid #ffffff40; border-radius: 12px;
    background: #291b38; color: #fff0cb; font: 700 18px "Trebuchet MS", system-ui, sans-serif; }
  input:focus { outline: 2px solid #ffcb6e; outline-offset: 2px; }
  button { height: 48px; padding: 0 22px; border: 1px solid #d5fb9b; border-radius: 12px; background: linear-gradient(155deg, #defa9c, #a6dc65);
    box-shadow: 0 3px 0 #547137; color: #21331a; font: 900 18px "Trebuchet MS", system-ui, sans-serif; cursor: pointer; }
  button:disabled { opacity: .6; }
  #msg { min-height: 1.4em; font-weight: 700; }
  #msg.bad { color: #ff9a7a; }
  .bar { height: 6px; margin: 6px auto 0; width: 70%; border-radius: 3px; background: #ffffff1a; overflow: hidden; visibility: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: #c6f775; transition: width .15s; }
  .tip { font-size: 13px; color: #cbb5bb; }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
  @media (max-height: 420px) { img { display: none; } h1 { margin-top: 0; } p { margin: 5px 0; } form { margin: 10px 0 4px; } }
</style>
</head>
<body>
<main>
  <img src="icon-180.png" alt="">
  <h1><span>Sneaky Fart</span><span>Escape</span></h1>
  <p id="intro">This game is just for friends. Type the password to play.</p>
  <form id="form" autocomplete="on">
    <input id="pw" type="password" name="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false"
      enterkeyhint="go" placeholder="Password" aria-label="Password">
    <button id="go" type="submit">Play</button>
  </form>
  <div class="bar" id="bar"><i id="fill"></i></div>
  <p id="msg" role="status"></p>
  <p class="tip">On iPhone: tap <b>Share</b>, then <b>Add to Home Screen</b> for a full-screen game icon. Turn the phone sideways to play.</p>
</main>
<script>
// The lock screen. game.bin is the whole game, encrypted (see web\build-web.mjs). The password makes the key that opens it.
(() => {
  const BIN_SIZE = 39368581, KEY_STORE = 'sfe_web_key';
  const $ = id => document.getElementById(id);
  const form = $('form'), pw = $('pw'), go = $('go'), msg = $('msg'), bar = $('bar'), fill = $('fill');
  const say = (s, bad) => { msg.textContent = s; msg.className = bad ? 'bad' : ''; };
  const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');
  const b64 = u8 => btoa(String.fromCharCode(...u8));
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const store = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
  const stored = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const subtle = window.crypto && crypto.subtle;
  if (!subtle) { say("This browser can't open the game. Try Safari or Chrome.", true); go.disabled = true; return; }

  // fetch the locked game straight away, so it is ready by the time the password is typed
  let binP = null;
  function fetchBin() {
    if (binP) return binP;
    binP = (async () => {
      const r = await fetch('game.bin', { cache: 'no-cache' });
      if (!r.ok) throw new Error('net ' + r.status);
      if (!r.body || !r.body.getReader) return new Uint8Array(await r.arrayBuffer());
      const reader = r.body.getReader(), parts = [];
      let got = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        parts.push(value); got += value.length;
        if (BIN_SIZE) fill.style.width = Math.min(100, got / BIN_SIZE * 100) + '%';
      }
      const out = new Uint8Array(got);
      let o = 0;
      for (const p of parts) { out.set(p, o); o += p.length; }
      return out;
    })().catch(e => { binP = null; throw new Error('net ' + (e && e.message)); });   // "net" errors never clear the saved key
    return binP;
  }
  function parts(bin) {
    if (String.fromCharCode(...bin.subarray(0, 4)) !== 'SFE1') throw new Error('net bad file');
    return { iter: new DataView(bin.buffer, bin.byteOffset).getUint32(4, true), salt: bin.subarray(8, 24), iv: bin.subarray(24, 36), ct: bin.subarray(36) };
  }
  async function keyFrom(password, salt, iter) {
    const base = await subtle.importKey('raw', new TextEncoder().encode(norm(password)), 'PBKDF2', false, ['deriveKey']);
    return subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  // unlock the game, swap each art/music path for the unlocked file, and start it in this page
  async function open(key, bin) {
    const { iv, ct } = parts(bin);
    const plain = new Uint8Array(await subtle.decrypt({ name: 'AES-GCM', iv }, key, ct));   // throws if the key is wrong
    const hlen = new DataView(plain.buffer).getUint32(0, true), at = 4 + hlen;
    const head = JSON.parse(new TextDecoder().decode(plain.subarray(4, at)));
    let html = new TextDecoder().decode(plain.subarray(at + head.html[0], at + head.html[0] + head.html[1]));
    for (const a of head.assets) {
      const url = URL.createObjectURL(new Blob([plain.subarray(at + a.o, at + a.o + a.n)], { type: a.t }));
      for (const q of ["'", '"']) html = html.split(q + a.p + q).join(q + url + q);
    }
    return html;
  }
  function start(html) { document.open(); document.write(html); document.close(); }
  function busy(on, text) { go.disabled = on; pw.disabled = on; bar.style.visibility = on ? 'visible' : 'hidden'; if (text != null) say(text); }

  async function tryPassword(password) {
    busy(true, 'Loading the game...');
    let bin, salt, iter;
    try { bin = await fetchBin(); ({ salt, iter } = parts(bin)); } catch (e) { busy(false, "Couldn't load the game. Check the internet and try again."); msg.className = 'bad'; return; }
    say('Checking the password...');
    const key = await keyFrom(password, salt, iter);
    let html;
    try { html = await open(key, bin); } catch (e) {
      busy(false); say("That's not the password. Try again!", true);
      form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake'); pw.select(); return;
    }
    store(KEY_STORE, JSON.stringify({ k: b64(new Uint8Array(await subtle.exportKey('raw', key))), s: b64(salt) }));
    start(html);
  }
  form.addEventListener('submit', e => { e.preventDefault(); if (norm(pw.value)) tryPassword(pw.value); else pw.focus(); });

  // this phone has the key already: open the game straight away
  (async () => {
    fetchBin().catch(() => {});
    let saved = null;
    try { saved = JSON.parse(stored(KEY_STORE)); } catch (e) {}
    if (!saved || !saved.k) return;
    busy(true, 'Opening the game...');
    try {
      const bin = await fetchBin(), { salt } = parts(bin);
      if (b64(salt) !== saved.s) throw new Error('new password');
      const key = await subtle.importKey('raw', unb64(saved.k), { name: 'AES-GCM' }, false, ['decrypt']);
      start(await open(key, bin));
    } catch (e) {
      if (String(e.message).startsWith('net')) { busy(false, "Couldn't load the game. Check the internet and try again."); msg.className = 'bad'; return; }
      store(KEY_STORE, null);   // the password has changed: ask again
      busy(false, 'The password has changed. Type the new one.');
    }
  })();
})();
</script>
</body>
</html>
